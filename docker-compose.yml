# TrustGraph AI — full stack
#   cp .env.example .env   (then set secrets)
#   docker compose up --build
# Dashboard: http://localhost:3000   Gateway docs: http://localhost:3001/docs
# Governance API docs: http://localhost:8000/docs   Neo4j browser: http://localhost:7474

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustgraph
      POSTGRES_USER: trustgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustgraph}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustgraph -d trustgraph"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-trustgraph-neo4j}
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  trustgraph-api:
    build:
      context: .
      dockerfile: Dockerfile.trustgraph
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      TRUSTGRAPH_DATABASE_URL: postgresql://trustgraph:${POSTGRES_PASSWORD:-trustgraph}@postgres:5432/trustgraph
      TRUSTGRAPH_SERVICE_TOKEN: ${TRUSTGRAPH_SERVICE_TOKEN:?set TRUSTGRAPH_SERVICE_TOKEN in .env}
      TRUSTGRAPH_TICKET_SECRET: ${TRUSTGRAPH_TICKET_SECRET:?set TRUSTGRAPH_TICKET_SECRET in .env}
      TRUSTGRAPH_NEO4J_ENABLED: "true"
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-trustgraph-neo4j}
      NEO4J_DATABASE: neo4j
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - evaluation-results:/app/evaluation/results

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      trustgraph-api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://trustgraph:${POSTGRES_PASSWORD:-trustgraph}@postgres:5432/trustgraph
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@trustgraph.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-TrustGraph!2026}
      TRUSTGRAPH_API_URL: http://trustgraph-api:8000
      TRUSTGRAPH_SERVICE_TOKEN: ${TRUSTGRAPH_SERVICE_TOKEN}
    ports:
      - "127.0.0.1:3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  neo4j-data:
  evaluation-results:
